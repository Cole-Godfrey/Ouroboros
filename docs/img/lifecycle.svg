<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-label="The agent sleeps unless something needs judgement" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="760" height="344" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The agent sleeps unless something needs judgement</text><rect x="24" y="56" width="216" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="80" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">1. Asleep</text><text x="36" y="96" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Costs nothing. Strategies keep</text><text x="36" y="112" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">trading, the reconciler reads</text><text x="36" y="128" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">balances every 15 minutes</text><rect x="272" y="56" width="216" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="284" y="80" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">2. Woken</text><text x="284" y="96" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">You write, something breaks,</text><text x="284" y="112" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">a timer or strategy fires, or</text><text x="284" y="128" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">the heartbeat runs out</text><rect x="520" y="56" width="216" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="532" y="80" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">3. Checked</text><text x="532" y="96" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Charter matches its seal,</text><text x="532" y="112" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">budget left, not paused.</text><text x="532" y="128" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">If not, it waits and alerts</text><rect x="520" y="224" width="216" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="532" y="248" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">4. Briefed</text><text x="532" y="264" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Built from the ledger: NAV,</text><text x="532" y="280" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">returns, budget, inbox,</text><text x="532" y="296" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">incidents, last handoff note</text><rect x="272" y="224" width="216" height="88" rx="8" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="284" y="248" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">5. Thinks and acts</text><text x="284" y="264" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">One Pi session, 45 min max,</text><text x="284" y="280" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">every token is metered,</text><text x="284" y="296" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">tools act, code gets written</text><rect x="24" y="224" width="216" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="248" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">6. Hands over</text><text x="36" y="264" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">episode_end: a handoff note,</text><text x="36" y="280" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">a lesson for the journal, and</text><text x="36" y="296" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">when to wake (5 min to 6 h)</text><path d="M240 100H272" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M488 100H520" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M628 144V224" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M520 268H488" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M272 268H240" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M132 224V144" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><text x="144" y="190" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">next wake</text><text x="616" y="190" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="end">checks pass</text><rect x="296" y="174" width="16" height="12" rx="3" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="320" y="184" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Only step that costs money</text></svg>
