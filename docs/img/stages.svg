<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="Five phases and four gates: money is risked only after paper trading proves an edge" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="760" height="640" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Five phases and four gates: money is risked only after paper trading proves an edge</text><line x1="40" x2="40" y1="92" y2="572" stroke="#8c959f" stroke-width="1.25"/><rect x="72" y="56" width="664" height="72" rx="8" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="84" y="80" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">1. Set up and research</text><text x="84" y="96" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Orient, read the harness, research which venues and strategies work at $1, write notes.</text><text x="84" y="112" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Build the paper-trading harness and the first venue adapter while waiting for funds.</text><circle cx="40" cy="92" r="5" fill="#8c959f"/><polygon points="40,140 52,152 40,164 28,152" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="72" y="150" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Gate A: funded</text><text x="72" y="166" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">USDC and gas ETH are in the wallet and recorded with ouro fund add</text><rect x="72" y="176" width="664" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="84" y="200" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">2. Paper trading</text><text x="84" y="216" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Candidate strategies run against the paper engine with real fees and slippage.</text><text x="84" y="232" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">A passive basket of majors is the benchmark every one must beat after costs.</text><circle cx="40" cy="212" r="5" fill="#8c959f"/><polygon points="40,260 52,272 40,284 28,272" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="72" y="270" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Gate B: paper edge proven</text><text x="72" y="286" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Beats the cost hurdle and the benchmark over a minimum sample the agent wrote down first</text><rect x="72" y="296" width="664" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="84" y="320" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">3. Tiny live allocation</text><text x="84" y="336" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">A small allocation in its own sub-account with a drawdown guard and written kill rules.</text><text x="84" y="352" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Live results are compared with paper results, trade by trade.</text><circle cx="40" cy="332" r="5" fill="#8c959f"/><polygon points="40,380 52,392 40,404 28,392" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="72" y="390" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Gate C: live matches paper</text><text x="72" y="406" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Within tolerance over the minimum sample, and no kill rule has fired</text><rect x="72" y="416" width="664" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="84" y="440" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">4. Scale in steps</text><text x="84" y="456" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">The allocation grows only while realised results match paper, and more strategies follow.</text><text x="84" y="472" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Ideas that trip their kill rules are stopped and written up.</text><circle cx="40" cy="452" r="5" fill="#8c959f"/><polygon points="40,500 52,512 40,524 28,512" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="72" y="510" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Gate D: NAV allows a smarter model</text><text x="72" y="526" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">The daily allowance can pay for a paid model, or NAV reaches $500 and you may fund thinking</text><rect x="72" y="536" width="664" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="84" y="560" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">5. Self-funded</text><text x="84" y="576" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">The agent pays for its own thinking from NAV, capped at 5% of NAV a day.</text><text x="84" y="592" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Your subsidy ends, and profit no longer needs reporting net of it.</text><circle cx="40" cy="572" r="5" fill="#8c959f"/></svg>
