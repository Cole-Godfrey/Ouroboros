name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # the gate tests create git repositories, so a committer identity must exist
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci
      - run: npm run check
