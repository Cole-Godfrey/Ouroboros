<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 740" width="760" height="740" role="img" aria-label="The agent thinks in Pi, and a daemon meters, records and checks all of it" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="760" height="740" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The agent thinks in Pi, and a daemon meters, records and checks all of it</text><rect x="552" y="52" width="16" height="12" rx="3" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="576" y="62" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Source of truth</text><rect x="552" y="76" width="16" height="12" rx="3" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="3 2"/><text x="576" y="86" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Written by the agent</text><text x="552" y="196" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Outside the VM</text><rect x="24" y="44" width="496" height="672" rx="12" fill="#f3f5f8" stroke="#8c959f" stroke-width="1.25"/><text x="40" y="66" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Ouroboros VM</text><text x="40" y="84" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Lima on Apple Virtualization.framework, no shared folders</text><text x="40" y="100" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Egress firewall: the internet yes, your Mac and LAN no</text><rect x="40" y="116" width="464" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="52" y="140" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Boot supervisor (root-owned, outside the repo)</text><text x="52" y="156" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Runs the daemon from current, rolls back on a crash loop</text><rect x="40" y="188" width="464" height="384" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="52" y="212" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Daemon (Node 22, TypeScript)</text><rect x="56" y="220" width="208" height="72" rx="8" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="68" y="244" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Audit log</text><text x="68" y="260" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Hash-chained events.jsonl,</text><text x="68" y="276" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">all state is a fold of it</text><rect x="56" y="308" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="68" y="332" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Self-mod pipeline</text><text x="68" y="348" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Gate, promote, probation,</text><text x="68" y="364" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">rollback, keeps old releases</text><rect x="56" y="396" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="68" y="420" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Scheduler</text><text x="68" y="436" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Wakes the agent on messages,</text><text x="68" y="452" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">incidents, timers, heartbeat</text><rect x="56" y="484" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="68" y="508" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Episode runner</text><text x="68" y="524" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Briefs the agent, enforces</text><text x="68" y="540" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">the budget, drives Pi</text><rect x="280" y="220" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="292" y="244" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Services</text><text x="292" y="260" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Vault, inbox, notifier,</text><text x="292" y="276" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">HTTP API and dashboard</text><rect x="280" y="308" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="292" y="332" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Metering proxy</text><text x="292" y="348" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">All model calls pass here,</text><text x="292" y="364" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">holds the key, caps spend</text><rect x="280" y="396" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="292" y="420" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Reconciler</text><text x="292" y="436" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Reads balances from each</text><text x="292" y="452" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">venue itself, computes NAV</text><rect x="280" y="484" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="292" y="508" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Process manager</text><text x="292" y="524" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Runs the strategies it wrote</text><text x="292" y="540" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">and restarts them</text><rect x="40" y="612" width="224" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="52" y="636" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Pi + Ouroboros extension</text><text x="52" y="652" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">The agent itself: 14 tools,</text><text x="52" y="668" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Charter and Constitution are</text><text x="52" y="684" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">in every prompt</text><rect x="280" y="612" width="224" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4"/><text x="292" y="636" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Agent-written code</text><text x="292" y="652" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Strategies, venue adapters,</text><text x="292" y="668" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">notes and memory it keeps</text><text x="292" y="684" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">between episodes</text><rect x="552" y="212" width="184" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="564" y="236" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">You</text><text x="564" y="252" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Phone: ntfy or Telegram</text><text x="564" y="268" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Terminal: ouro commands</text><text x="564" y="284" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Browser: the dashboard</text><rect x="552" y="308" width="184" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="564" y="332" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">LLM provider</text><text x="564" y="348" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Free models by default,</text><text x="564" y="364" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">paid ones when it can pay</text><rect x="552" y="396" width="184" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="564" y="420" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Venues and the web</text><text x="564" y="436" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">DEXs, prediction markets,</text><text x="564" y="452" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">brokers, exchanges, sites</text><path d="M272 172V188" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M160 556V612" fill="none" stroke="#8c959f" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/><path d="M384 556V612" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M488 256H552" fill="none" stroke="#8c959f" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/><path d="M488 344H552" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M488 432H552" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M504 656H644V468" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><text x="172" y="596" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">briefing in, tool calls out</text><text x="396" y="596" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">starts, stops</text><text x="636" y="560" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="end">orders and trades</text></svg>
