<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 568" width="760" height="568" role="img" aria-label="Every change passes a gate, then a probation, and a bad one is undone automatically" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="760" height="568" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Every change passes a gate, then a probation, and a bad one is undone automatically</text><rect x="24" y="56" width="400" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="80" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">1. Edit</text><text x="36" y="96" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">The agent edits its working copy: code, prompts, tests</text><rect x="24" y="128" width="400" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="152" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">2. Propose</text><text x="36" y="168" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">selfmod propose commits the change. It refuses a diff</text><text x="36" y="184" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">that looks like a secret, or a commit already rolled back</text><rect x="24" y="216" width="400" height="88" rx="8" fill="#2f6fdd1f" stroke="#2f6fdd" stroke-width="2"/><text x="36" y="240" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">3. Gate</text><text x="36" y="256" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">On an exported copy, in a scratch home, in order:</text><text x="36" y="272" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">typecheck, every test, a boot check in the real Pi,</text><text x="36" y="288" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">and a check that the Charter matches its seal</text><rect x="24" y="320" width="400" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="344" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">4. Promote</text><text x="36" y="360" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">An immutable release is built and current points at it.</text><text x="36" y="376" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">The daemon restarts into it when next idle.</text><rect x="24" y="408" width="400" height="104" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="432" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">5. Probation</text><text x="36" y="448" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">15 minutes, or 1 hour if the change touches protected paths</text><text x="36" y="464" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">(Charter, boot, ledger, vault, reconciler, self-test).</text><text x="36" y="480" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Watched for failure: two failed episodes and none</text><text x="36" y="496" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">that succeeded, or a crash loop the supervisor catches.</text><rect x="456" y="224" width="280" height="72" rx="8" fill="none" stroke="#cf222e" stroke-width="2"/><text x="468" y="248" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Rejected</text><text x="468" y="264" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">A check failed and nothing changes.</text><text x="468" y="280" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">The agent reads why and tries again.</text><rect x="456" y="392" width="280" height="56" rx="8" fill="none" stroke="#2da44e" stroke-width="2"/><text x="468" y="416" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Confirmed</text><text x="468" y="432" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Last known good moves to this release</text><rect x="456" y="464" width="280" height="72" rx="8" fill="none" stroke="#cf222e" stroke-width="2"/><text x="468" y="488" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Rolled back</text><text x="468" y="504" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">current returns to the last good one,</text><text x="468" y="520" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">you are told, the commit is barred</text><path d="M224 112V128" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M224 200V216" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M224 304V320" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M224 392V408" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M424 260H456" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M424 420H456" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M424 500H456" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/></svg>
