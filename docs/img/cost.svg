<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-label="Reaching $500 at +1% a day costs $625 to $3,125 of your own money in thinking" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="760" height="390" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><text x="40" y="28" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Reaching $500 at +1% a day costs $625 to $3,125 of your own money in thinking</text><text x="40" y="48" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Cost of thinking until NAV grows from $1 to $500, at a constant daily growth rate</text><rect x="40" y="62" width="14" height="12" rx="3" fill="#c3c8cf"/><text x="62" y="72" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Default cap, $5 a day</text><rect x="260" y="62" width="14" height="12" rx="3" fill="#2f6fdd"/><text x="282" y="72" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Lower cap, $1 a day</text><rect x="394.0" y="86" width="162.0" height="254" rx="8" fill="#f3f5f8"/><line x1="40" x2="736" y1="292" y2="292" stroke="#8c959f"/><rect x="71.0" y="102.0" width="52" height="190.0" fill="#c3c8cf"/><text x="97.0" y="94.0" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">$12,445</text><rect x="131.0" y="254.0" width="52" height="38.0" fill="#2f6fdd"/><text x="157.0" y="246.0" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">$2,489</text><text x="127.0" y="314" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">+0.25% a day</text><text x="127.0" y="332" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">2,489 days, 6.8 years</text><rect x="245.0" y="196.80916030534348" width="52" height="95.1908396946565" fill="#c3c8cf"/><text x="271.0" y="188.80916030534348" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">$6,235</text><rect x="305.0" y="272.9618320610687" width="52" height="19.0381679389313" fill="#2f6fdd"/><text x="331.0" y="264.9618320610687" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">$1,247</text><text x="301.0" y="314" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">+0.5% a day</text><text x="301.0" y="332" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">1,247 days, 3.4 years</text><rect x="419.0" y="244.29007633587787" width="52" height="47.70992366412214" fill="#c3c8cf"/><text x="445.0" y="236.29007633587787" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">$3,125</text><rect x="479.0" y="282.4580152671756" width="52" height="9.541984732824428" fill="#2f6fdd"/><text x="505.0" y="274.4580152671756" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">$625</text><text x="475.0" y="314" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">+1% a day</text><text x="475.0" y="332" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">625 days, 1.7 years</text><rect x="593.0" y="268.03053435114504" width="52" height="23.96946564885496" fill="#c3c8cf"/><text x="619.0" y="260.03053435114504" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">$1,570</text><rect x="653.0" y="287.206106870229" width="52" height="4.793893129770993" fill="#2f6fdd"/><text x="679.0" y="279.206106870229" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">$314</text><text x="649.0" y="314" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">+2% a day</text><text x="649.0" y="332" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">314 days, 0.9 years</text><text x="40" y="372" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">Assumes the growth rate holds from $1 upward, which fixed costs make unlikely at small size.</text></svg>
